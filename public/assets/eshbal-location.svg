<title id="map-title">Eshbal, Haifa, Acre and the Sea of Galilee</title>
<desc id="map-description">A close-up physical map of the Galilee and Haifa Bay in northern Israel. Eshbal is highlighted inland, east of Acre and northeast of Haifa. The Sea of Galilee is shown to the east.</desc>
